name: Release runtime

on:
  workflow_dispatch:
    inputs:
      component:
        description: Runtime component
        required: true
        type: choice
        options: [codex, grok]
      version:
        description: Exact MAJOR.MINOR.PATCH version
        required: true
      config_version:
        description: Monotonically increasing configuration version
        required: true
        default: '1'
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, preview]
        default: stable

env:
  SUUTOKEN_RUNTIME_PUBLIC_KEY_HEX: 2ec5838862c48bdc3cbaa6ac74f208294a6a1920a003a56d0bbede162992f800

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
          - platform: linux
            arch: aarch64
          - platform: windows
            arch: x86_64
          - platform: macos
            arch: x86_64
          - platform: macos
            arch: aarch64
    runs-on: ubuntu-latest
    env:
      OPENCODEX_VERSION: ${{ inputs.version }}
      OPENCODEX_CONFIG_VERSION: ${{ inputs.config_version }}
      OPENCODEX_PLATFORM: ${{ matrix.platform }}
      OPENCODEX_ARCH: ${{ matrix.arch }}
      RUNTIME_COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Validate release inputs
        shell: bash
        run: node scripts/validate-release-inputs.mjs
      - run: npm ci
      - name: Package unsigned runtime
        shell: bash
        run: |
          set -euo pipefail
          output="dist/${RUNTIME_COMPONENT}-${OPENCODEX_VERSION}-${OPENCODEX_PLATFORM}-${OPENCODEX_ARCH}.zip"
          node "scripts/package-${RUNTIME_COMPONENT}.mjs" \
            "$OPENCODEX_VERSION" \
            "$OPENCODEX_PLATFORM" \
            "$OPENCODEX_ARCH" \
            "$output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ inputs.component }}-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/${{ inputs.component }}-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
            dist/${{ inputs.component }}-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip.metadata.json

  sign:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENCODEX_VERSION: ${{ inputs.version }}
      OPENCODEX_CONFIG_VERSION: ${{ inputs.config_version }}
      RUNTIME_COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate release inputs
        run: node scripts/validate-release-inputs.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-${{ inputs.component }}-*
          path: dist
          merge-multiple: true
      - name: Sign manifests
        env:
          SUUTOKEN_RUNTIME_SIGNING_KEY: ${{ secrets.SUUTOKEN_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="${RUNTIME_COMPONENT}-v${OPENCODEX_VERSION}-c${OPENCODEX_CONFIG_VERSION}"
          prefix="${RUNTIME_COMPONENT}-${OPENCODEX_VERSION}-"
          shopt -s nullglob
          zips=(dist/${prefix}*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "no unsigned zip artifacts" >&2
            exit 1
          fi
          for zip in "${zips[@]}"; do
            spec="$(basename "$zip" .zip)"
            spec="${spec#"$prefix"}"
            node scripts/create-manifest.mjs \
              "$zip" \
              "$OPENCODEX_CONFIG_VERSION" \
              "$tag" \
              "dist/${spec}.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ inputs.component }}
          if-no-files-found: error
          path: dist/*

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENCODEX_VERSION: ${{ inputs.version }}
      OPENCODEX_CONFIG_VERSION: ${{ inputs.config_version }}
      OPENCODEX_CHANNEL: ${{ inputs.channel }}
      RUNTIME_COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate release inputs
        run: node scripts/validate-release-inputs.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-${{ inputs.component }}
          path: dist
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RUNTIME_COMPONENT}-v${OPENCODEX_VERSION}-c${OPENCODEX_CONFIG_VERSION}"
          gh release create "$tag" dist/* \
            --title "${RUNTIME_COMPONENT} ${OPENCODEX_VERSION} / config ${OPENCODEX_CONFIG_VERSION}" \
            --notes "Signed SuuToken runtime artifacts."
      - name: Update channel manifests
        run: |
          set -euo pipefail
          mkdir -p "channels/${RUNTIME_COMPONENT}/${OPENCODEX_CHANNEL}"
          copied=0
          for manifest in dist/*.json; do
            case "$manifest" in
              *.metadata.json) continue ;;
            esac
            cp "$manifest" "$manifest.sig" "channels/${RUNTIME_COMPONENT}/${OPENCODEX_CHANNEL}/"
            copied=$((copied + 1))
          done
          if [ "$copied" -eq 0 ]; then
            echo "no signed manifests" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add channels
          git commit -m "release: ${RUNTIME_COMPONENT} ${OPENCODEX_VERSION} config ${OPENCODEX_CONFIG_VERSION}"
          git push
